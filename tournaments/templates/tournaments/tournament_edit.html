{% extends 'base.html' %}

{% block content %}
<div class="card p-4" style="max-width: 640px; margin-inline: auto;">
    <h1 class="mb-1">Modifica torneo</h1>
    <p class="mb-4">Aggiorna le informazioni del torneo "{{ object.name }}".</p>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100 mt-2">💾 Salva modifiche</button>
    </form>
</div>
{% endblock %}
