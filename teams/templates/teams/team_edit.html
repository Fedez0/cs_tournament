{% extends 'base.html' %}


{% block content %}
<div class="container mt-5">
    <h2>Modifica Team</h2>
    <form method="post" enctype="multipart/form-data">
        <img src="{{ icon }}" alt="Icona del Team" width="100" height="100" class="rounded mb-3">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Salva Modifiche</button>
    </form>
</div>

{% endblock%}
