<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>cs_tournament</title>
    {% load static %}
    <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
    :root {
        --primary: #f0522a;
        --bg-900: #0a0e17;
        --bg-850: #0d0f13;
        --bg-800: #111318;
        --bg-700: #1a1d24;
        --border: #2a2d35;
        --text-main: #e2e2e2;
        --text-muted: #8a8d96;
        --info: #85b7eb;
        --danger: #e24b4a;
        --warning: #f0a030;
        --success: #4caf74;
        --blue: #2563eb;
    }
    body {
        --bs-body-bg: var(--bg-900);
        --bs-body-color: var(--text-main);
        --bs-primary: var(--primary);
        --bs-primary-rgb: 240, 82, 42;
        --bs-secondary-bg: var(--bg-700);
        --bs-border-color: var(--border);
        --bs-link-color: var(--text-main);
        --bs-link-hover-color: #fff;
        background: radial-gradient(1200px 600px at 85% -10%, rgba(240, 82, 42, 0.2), transparent 60%), linear-gradient(180deg, var(--bg-900) 0%, var(--bg-850) 100%);
        color: var(--text-main);
        letter-spacing: 0.01em;
        animation: fadeInPage .55s ease-out;
    }
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image:
            linear-gradient(180deg, rgba(10,14,23,0.75), rgba(10,14,23,0.9)),
            url("{% static 'img/bg.jpg' %}");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        filter: blur(6px);
        transform: scale(1.05); /* evita bordi trasparenti dovuti al blur */
    }
    @keyframes fadeInPage {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
    }
    a, button, .btn, .card, .list-group-item, input, select, textarea {
        transition: all .25s ease;
    }
    a { color: var(--text-main); text-decoration: none; }
    a:hover { color: #fff; }
    h1, h2, h3, h4 { font-weight: 700; letter-spacing: .02em; }
    p, small, li, label { color: var(--text-muted); }

    .nav {
        position: sticky;
        top: 0;
        z-index: 1030;
        min-height: 68px;
        background: rgba(13, 15, 19, 0.92);
        border-bottom: 1px solid var(--border);
        padding: 0 1.25rem;
        display: flex;
        align-items: center;
        gap: 1rem;
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.35);
    }
    .nav-logo {
        display: flex;
        align-items: center;
        gap: .5rem;
        color: var(--primary);
        font-weight: 800;
        text-transform: uppercase;
        text-decoration: none !important;
        text-shadow: 0 0 18px rgba(240, 82, 42, 0.45);
    }
    .logo-img {
        height: 32px;
        width: auto;
        object-fit: contain;
        filter: drop-shadow(0 0 8px rgba(240, 82, 42, 0.45));
        animation: logoPulse 2.6s ease-in-out infinite;
    }
    @keyframes logoPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
    }
    .nav-link {
        position: relative;
        color: var(--text-muted);
        font-weight: 600;
        padding: .5rem .25rem !important;
    }
    .nav-link::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -6px;
        width: 100%;
        height: 2px;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, var(--primary), transparent);
        transform: scaleX(0);
        transform-origin: center;
    }
    .nav-link:hover, .nav-link.active {
        color: var(--text-main);
        text-shadow: 0 0 8px rgba(240, 82, 42, .45);
    }
    .nav-link:hover::after, .nav-link.active::after { transform: scaleX(1); }
    .nav-right {
        margin-left: auto;
        display: flex;
        gap: .65rem;
        align-items: center;
    }
    

    .btn,
    button,
    input[type="submit"],
    .btn-primary,
    .btn-ghost {
        border-radius: 12px !important;
        border: 1px solid transparent;
        font-weight: 700;
        padding: .55rem 1rem;
    }
    .btn-primary,
    button:not(.btn-close),
    input[type="submit"] {
        background: linear-gradient(135deg, #f35d34, #f0522a 56%, #d6421f);
        border-color: #ff7b52;
        color: #fff !important;
        box-shadow: 0 8px 22px rgba(240, 82, 42, .3);
    }
    .btn-primary:hover,
    button:not(.btn-close):hover,
    input[type="submit"]:hover {
        transform: translateY(-1px) scale(1.01);
        box-shadow: 0 0 0 3px rgba(240, 82, 42, .2), 0 14px 28px rgba(240, 82, 42, .32);
    }
    .btn-ghost,
    .btn-outline-primary,
    .btn-outline-danger,
    .btn-secondary {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--border);
        color: var(--text-main) !important;
    }
    .btn-ghost:hover,
    .btn-outline-primary:hover,
    .btn-outline-danger:hover,
    .btn-secondary:hover {
        background: rgba(240, 82, 42, 0.09);
        border-color: var(--primary);
        color: #fff !important;
        box-shadow: 0 0 18px rgba(240, 82, 42, .2);
    }

    main {
        width: min(1200px, calc(100% - 2rem));
        margin: 1.25rem auto 2rem;
    }
    main > h1,
    main > h2,
    main > p,
    main > form,
    main > a,
    main > div {
        max-width: 980px;
    }
    main > div,
    main > form,
    main > div.row {   /* <-- aggiunto: (0,1,1) batte .row da solo (0,1,0) */
        margin-inline: auto;
    }
    main > h1 {
        font-size: clamp(2rem, 4vw, 3rem);
        margin-bottom: .75rem;
        text-transform: uppercase;
        color: #fff;
        text-shadow: 0 0 20px rgba(240, 82, 42, .28);
    }
    main > h1 + a,
    main > h1 + a + a,
    main > h1 + a + a + a {
        display: inline-flex;
        margin-right: .5rem;
        margin-bottom: .7rem;
    }
    main > p,
    main > h2 + p {
        font-size: 1.02rem;
        margin-bottom: 1rem;
    }

    .container.mt-5,
    .container[style*="max-width"] {
        background: linear-gradient(180deg, rgba(26, 29, 36, 0.88), rgba(17, 19, 24, 0.92));
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: clamp(1.1rem, 2vw, 1.8rem);
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.32);
    }
    .card,
    .alert,
    .list-group-item,
    .stat,
    .match {
        background: linear-gradient(180deg, rgba(26, 29, 36, .95), rgba(17, 19, 24, .96)) !important;
        border: 1px solid var(--border) !important;
        color: var(--text-main);
    }
    .card,
    .list-group-item {
        border-radius: 14px !important;
    }
    .card:hover,
    .list-group-item:hover {
        transform: translateY(-2px);
        border-color: rgba(240, 82, 42, 0.6) !important;
        box-shadow: 0 10px 24px rgba(0, 0, 0, .35), 0 0 0 2px rgba(240, 82, 42, .18);
    }
    .badge.bg-primary,
    .badge.rounded-pill {
        background: linear-gradient(135deg, #f4734f, #f0522a 58%, #f0a030) !important;
        color: #fff !important;
        box-shadow: 0 5px 14px rgba(240, 82, 42, .3);
    }
    .list-group-item:nth-child(-n+3) .fw-semibold {
        animation: rankPulse 1.2s ease-out both;
    }
    .list-group-item:nth-child(2) .fw-semibold { animation-delay: .1s; }
    .list-group-item:nth-child(3) .fw-semibold { animation-delay: .2s; }
    @keyframes rankPulse {
        0% { transform: translateX(-8px); opacity: 0; }
        100% { transform: translateX(0); opacity: 1; }
    }
    .list-group-item img,
    img.rounded,
    img.rounded-circle {
        border: 1px solid var(--border);
        box-shadow: 0 0 14px rgba(0, 0, 0, .35);
    }

    form {
        background: rgba(26, 29, 36, 0.5);
        border: 1px solid rgba(42, 45, 53, 0.8);
        border-radius: 14px;
        padding: 1rem;
    }
    form p { margin-bottom: .95rem; }
    input[type="text"],
    input[type="password"],
    input[type="email"],
    input[type="url"],
    input[type="tel"],
    input[type="number"],
    input[type="file"],
    select,
    textarea,
    .form-control,
    .form-select {
        width: 100%;
        background: rgba(10, 14, 23, 0.95) !important;
        border: 1px solid var(--border) !important;
        color: var(--text-main) !important;
        border-radius: 11px !important;
        padding: .55rem .75rem;
    }
    input:focus,
    select:focus,
    textarea:focus,
    .form-control:focus,
    .form-select:focus {
        border-color: var(--primary) !important;
        box-shadow: 0 0 0 .2rem rgba(240, 82, 42, .22) !important;
        outline: 0;
    }
    .errorlist,
    .text-danger {
        color: var(--danger) !important;
        font-size: .9rem;
        list-style: none;
        padding-left: 0;
    }

    .alert-success { border-color: rgba(76, 175, 116, .6) !important; box-shadow: inset 0 0 0 1px rgba(76, 175, 116, .2); }
    .alert-warning { border-color: rgba(240, 160, 48, .6) !important; box-shadow: inset 0 0 0 1px rgba(240, 160, 48, .2); }
    .alert-danger { border-color: rgba(226, 75, 74, .7) !important; box-shadow: inset 0 0 0 1px rgba(226, 75, 74, .24); }
    .alert-info { border-color: rgba(133, 183, 235, .65) !important; box-shadow: inset 0 0 0 1px rgba(133, 183, 235, .22); }
        /* --- HERO BANNER & STATS --- */
    .hero-header {
        position: relative;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid var(--border);
        margin-bottom: 2rem;
        background: var(--bg-800);
    }
    .hero-banner-img {
        width: 100%;
        height: 280px;
        object-fit: cover;
        filter: brightness(0.65);
    }
    .hero-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, transparent 20%, var(--bg-800) 100%);
    }
    .hero-content {
        position: relative;
        margin-top: -80px;
        padding: 0 2rem 1.5rem 2rem;
        z-index: 2;
    }
    .hero-title {
        font-size: clamp(2rem, 3.5vw, 3rem);
        text-transform: uppercase;
        font-weight: 800;
        color: #fff;
        text-shadow: 0 0 25px rgba(240, 82, 42, 0.4);
    }
    .stat-box {
        background: rgba(10, 14, 23, 0.7);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 0.85rem 1rem;
        text-align: center;
    }
    .stat-box .val {
        font-size: 1.15rem;
        font-weight: 700;
        color: #fff;
    }
    .stat-box .lbl {
        font-size: 0.75rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    /* --- TEAMS GRID --- */
    .teams-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 0.75rem;
    }
    .team-chip {
        background: var(--bg-800);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.5rem 0.85rem;
        display: flex;
        align-items: center;
        gap: 0.65rem;
        font-weight: 600;
    }
    .team-chip img {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        object-fit: cover;
    }

    /* --- VISUAL TOURNAMENT BRACKET --- */
    .bracket-wrapper {
        display: flex;
        gap: 2rem;
        overflow-x: auto;
        padding: 1.5rem 0.5rem 2rem 0.5rem;
        align-items: center;
    }
    .bracket-round {
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        min-width: 280px;
        gap: 1.5rem;
    }
    .round-header {
        text-align: center;
        font-size: 0.85rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--primary);
        margin-bottom: 0.5rem;
    }
    .match-card {
        background: var(--bg-800) !important;
        border: 1px solid var(--border) !important;
        border-radius: 12px !important;
        overflow: hidden;
        position: relative;
        box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }
    .match-team {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.65rem 0.85rem;
        font-weight: 600;
        font-size: 0.95rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }
    .match-team:last-child {
        border-bottom: none;
    }
    .match-team.vincitore {
        background: rgba(76, 175, 116, 0.12);
        color: var(--success);
        font-weight: 700;
    }
    .match-score {
        background: var(--bg-900);
        border: 1px solid var(--border);
        padding: 0.15rem 0.5rem;
        border-radius: 6px;
        font-family: monospace;
        font-weight: 700;
    }
    .match-admin-box {
        background: rgba(10, 14, 23, 0.6);
        border-top: 1px solid var(--border);
        padding: 0.5rem;
    }

    /* --- WINNER BANNER --- */
    .winner-card {
        background: linear-gradient(135deg, rgba(240, 160, 48, 0.15), rgba(240, 82, 42, 0.2));
        border: 2px solid var(--warning) !important;
        border-radius: 16px;
        padding: 2rem;
        text-align: center;
        box-shadow: 0 0 30px rgba(240, 160, 48, 0.25);
    }
    .tournament-banner {
        width: 100%;
        height: min(40vh, 320px);
        object-fit: cover;
        border-radius: 16px;
        border: 1px solid var(--border);
        background: #000;
        box-shadow: 0 14px 30px rgba(0, 0, 0, .38);
    }
    .tournament-winner {
        text-align: center;
        padding: 2rem;
        margin-top: 2rem;
        background: linear-gradient(145deg, #f0a030, #f0522a);
        border-radius: 16px;
        color: #151515;
        box-shadow: 0 14px 28px rgba(240, 82, 42, .28);
    }
    .tournament-winner img {
        border-radius: 50%;
        border: 4px solid rgba(255, 255, 255, .6);
        margin-bottom: 1rem;
    }

    .bracket {
        display: flex;
        gap: 1rem;
        overflow-x: auto;
        padding-bottom: .6rem;
    }
    .round {
        min-width: 280px;
        background: rgba(26, 29, 36, 0.8);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: .85rem;
    }
    .match {
        border-radius: 10px;
        padding: .65rem .7rem;
        margin-bottom: .65rem;
    }
    .vincitore { color: #fff; text-shadow: 0 0 12px rgba(76, 175, 116, 0.55); }

    footer {
        margin-top: auto;
        background: linear-gradient(180deg, #0d0f13, #0a0e17) !important;
        border-top: 1px solid var(--border);
        color: var(--text-muted) !important;
    }
    footer small { color: var(--text-muted) !important; }
    footer a {
        color: var(--text-main) !important;
        text-decoration: none;
    }
    footer a:hover {
        color: #fff !important;
        text-shadow: 0 0 12px rgba(240, 82, 42, .4);
    }
    footer a[href="/admin/"] {
        opacity: .18;
        transition: opacity .2s ease;
    }
    footer:hover a[href="/admin/"] { opacity: .9; }

    @media (max-width: 900px) {
        .nav {
            min-height: 62px;
            gap: .75rem;
            padding-inline: .85rem;
            flex-wrap: wrap;
        }
        .nav-logo { font-size: .9rem; }
        .logo-img { height: 26px; }
        .nav-right { width: 100%; justify-content: flex-end; padding-bottom: .65rem; }
    }
    @media (max-width: 768px) {
        main { width: calc(100% - 1rem); margin-top: .8rem; }
        main > h1 { font-size: 1.65rem; }
        .container.mt-5,
        .container[style*="max-width"] {
            border-radius: 14px;
            padding: .95rem;
        }
        .round { min-width: 250px; }
    }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    {% block header %}
        {% include "components/header.html" %}
    {% endblock %}

    <main class="flex-grow-1">

        {% if messages %}
            <div class="container mt-3">
                {% for message in messages %}
                    <div class="alert {% if message.tags %}alert-{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}

        {% endblock %}

    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    {% block footer %}
        {% include "components/footer.html" %}
    {% endblock %}
</body>
</html>
