{% extends 'base.html' %}

{% block title %}Sign Up{% endblock %}

{% block content %}
<style>
    .signup-page {
        min-height: min(680px, calc(100vh - 150px));
        display: grid;
        place-items: center;
        padding: 2rem 0;
    }

    .signup-layout {
        width: min(920px, 100%);
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(320px, 430px);
        overflow: hidden;
        background: linear-gradient(135deg, rgba(26, 29, 36, .96), rgba(17, 19, 24, .96));
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 20px 55px rgba(0, 0, 0, .42), 0 0 35px rgba(240, 82, 42, .08);
    }

    .signup-intro {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 500px;
        padding: clamp(2rem, 5vw, 4rem);
        background: linear-gradient(145deg, rgba(240, 82, 42, .2), transparent 62%),
            url("{% load static %}{% static 'img/login.png' %}") center / cover;
    }

    .signup-intro::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(10, 14, 23, .2), rgba(10, 14, 23, .88));
    }

    .signup-intro > * { position: relative; z-index: 1; }
    .signup-kicker {
        margin-bottom: 1rem;
        color: var(--primary);
        font-size: .78rem;
        font-weight: 800;
        letter-spacing: .14em;
        text-transform: uppercase;
    }
    .signup-intro h1 {
        max-width: 360px;
        margin-bottom: .8rem;
        color: #fff;
        font-size: clamp(2.2rem, 5vw, 3.5rem);
        line-height: 1;
        text-transform: uppercase;
    }
    .signup-intro p { max-width: 320px; margin-bottom: 0; line-height: 1.6; }

    .signup-panel { padding: clamp(1.4rem, 4vw, 2.5rem); }
    .signup-panel form {
        margin: 0;
        padding: 0;
        background: transparent;
        border: 0;
    }
    .signup-panel form p { margin-bottom: 1rem; }
    .signup-panel label {
        display: block;
        margin-bottom: .4rem;
        color: var(--text-main);
        font-size: .9rem;
        font-weight: 700;
    }
    .signup-panel input { min-height: 46px; }
    .signup-panel .helptext {
        display: block;
        margin-top: .35rem;
        color: var(--text-muted);
        font-size: .78rem;
        line-height: 1.45;
    }
    .signup-panel .errorlist {
        margin: .35rem 0 0;
        padding-left: 0;
    }
    .signup-actions {
        display: flex;
        gap: .7rem;
        margin-top: 1.35rem;
    }
    .signup-actions .btn { flex: 1; text-align: center; }

    @media (max-width: 700px) {
        .signup-page { min-height: auto; padding: 1rem 0 2rem; }
        .signup-layout { grid-template-columns: 1fr; }
        .signup-intro { min-height: 250px; padding: 2rem; }
        .signup-intro h1 { font-size: 2.4rem; }
    }

    @media (max-width: 400px) {
        .signup-actions { flex-direction: column; }
    }
</style>

<section class="signup-page" aria-labelledby="signup-title">
    <div class="signup-layout">
        <div class="signup-intro">
            <span class="signup-kicker">CS Tournament</span>
            <h1 id="signup-title">Entra in partita.</h1>
            <p>Crea il tuo account e porta la tua squadra dentro la competizione.</p>
        </div>

        <div class="signup-panel">
            <div class="mb-4">
                <h2 class="h3 mb-1">Crea account</h2>
                <p class="mb-0">Compila i dati per iniziare.</p>
            </div>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="signup-actions">
                    <button type="submit" class="btn btn-primary">Registrati</button>
                    <a href="{% url 'login' %}" class="btn btn-ghost">Accedi</a>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
